<script>
  const menuToggleBtn = document.querySelector(".p9tss-menu-btn");
  if (menuToggleBtn) {
    menuToggleBtn.addEventListener("click", function () {
      const menu = document.querySelector(".p9tss-menu");
      if (!menu) return;
      const isOpen = menu.classList.toggle("active");
      const icon = this.querySelector(".p9tss-icon");
      if (icon) {
        icon.textContent = isOpen ? "close" : "menu";
      }
    });
  }

  document.querySelectorAll(".p9tss-top").forEach(function (button) {
    button.addEventListener("click", function () {
      const group = this.closest(".p9tss-menu-group");
      if (!group) return;
      const sub = group.querySelector(".p9tss-sub");
      const isOpen = group.classList.toggle("open");
      this.classList.toggle("active", isOpen);
      const icon = this.querySelector(".p9tss-icon");
      if (icon) {
        icon.textContent = isOpen ? "expand_less" : "expand_more";
      }
      if (sub) {
        sub.classList.toggle("show", isOpen);
      }
    });
  });
</script>
