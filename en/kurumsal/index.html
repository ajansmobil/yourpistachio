  if (typeof menu2_toggle === "undefined") {
    function menu2_toggle() {
      var root = document.getElementById("menu-2-root");
      if (!root) {
        return;
      }
      if (root.classList.contains("fgrsumenu-open")) {
        root.classList.remove("fgrsumenu-open");
      } else {
        root.classList.add("fgrsumenu-open");
      }
    }
  }
