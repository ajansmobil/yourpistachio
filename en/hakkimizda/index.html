<script>
  const menuToggleBtn = document.querySelector(".mqcy3-menu-btn");
  if (menuToggleBtn) {
    menuToggleBtn.addEventListener("click", function () {
      const menu = document.querySelector(".mqcy3-menu");
      if (!menu) return;
      const isOpen = menu.classList.toggle("active");
      const icon = this.querySelector(".mqcy3-icon");
      if (icon) {
        icon.textContent = isOpen ? "close" : "menu";
      }
    });
  }

  document.querySelectorAll(".mqcy3-top").forEach(function (button) {
    button.addEventListener("click", function () {
      const group = this.closest(".mqcy3-menu-group");
      if (!group) return;
      const sub = group.querySelector(".mqcy3-sub");
      const isOpen = group.classList.toggle("open");
      this.classList.toggle("active", isOpen);
      const icon = this.querySelector(".mqcy3-icon");
      if (icon) {
        icon.textContent = isOpen ? "expand_less" : "expand_more";
      }
      if (sub) {
        sub.classList.toggle("show", isOpen);
      }
    });
  });
</script>
